version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ALLOWED_ORIGINS=*
      - REDIS_URL=${REDIS_URL}
    env_file:
      - .env.local
    networks:
      - slither-network

networks:
  slither-network:
    driver: bridge
